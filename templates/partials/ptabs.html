{% from "partials/card.html" import card %}
<section class="mdk mdk-ptabs"><div class="mdk-wrap">
{{ head|safe }}
<div class="wd-products-tabs" data-ptabs>
  <div class="ptabs-bar">
    <div class="ptabs-navwrap" data-hs><div class="ptabs-nav m-hs-list" role="tablist">{% for t in tabs %}<button type="button" role="tab" id="pt{{ loop.index }}" aria-controls="pp{{ loop.index }}" aria-selected="{{ 'true' if loop.first else 'false' }}"{% if not loop.first %} tabindex="-1"{% endif %}>{{ t.name }}</button>{% endfor %}</div><button type="button" class="m-hs-btn m-hs-prev" tabindex="-1" aria-hidden="true">{{ ico('caret-left') }}</button><button type="button" class="m-hs-btn m-hs-next" tabindex="-1" aria-hidden="true">{{ ico('caret-left') }}</button></div>
    <div class="ptabs-arrows"><button type="button" class="ptabs-prev" aria-label="المنتجات السابقة" disabled>{{ ico('arrow-left') }}</button><button type="button" class="ptabs-next" aria-label="المنتجات التالية">{{ ico('arrow-left') }}</button></div>
  </div>
  {% for t in tabs %}<div class="ptabs-panel" role="tabpanel" id="pp{{ loop.index }}" aria-labelledby="pt{{ loop.index }}" data-cat="{{ t.cat.id }}" data-order="{{ t.order }}"{% if not loop.first %} hidden{% endif %}><div class="m-grid">{% for p in t['items'] %}{{ card(p) }}{% endfor %}</div><p class="ptabs-all"><a class="m-btn m-btn-line" href="{{ t.cat.path }}">كل منتجات {{ t.name }}</a></p></div>
  {% endfor %}
</div>
</div></section>
