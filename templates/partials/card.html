{%- macro card(p, eager=False) -%}
<div class="wd-product wd-hover-alt product-grid-item product" data-id="{{ p.id }}"><div class="product-wrapper"><div class="product-element-top">{% if p.badge %}<div class="product-labels"><span class="onsale product-label">-{{ p.badge }}%</span></div>{% endif %}<a class="product-image-link" href="{{ p.path }}" aria-label="{{ p.name }}"><img src="{{ p.thumb }}" width="430" height="430" alt="{{ p.alt }}"{% if not eager %} loading="lazy"{% endif %} decoding="async"></a>{% if p.thumb2 %}<div class="hover-img"><img src="{{ p.thumb2 }}" width="430" height="430" alt="" loading="lazy" decoding="async"></div>{% endif %}</div><div class="wd-product-header"><h3 class="wd-entities-title"><a href="{{ p.path }}">{{ p.name }}</a></h3></div><div class="wd-product-cats">{% for c in p.catlinks %}<a href="{{ c.path }}" rel="tag">{{ c.name }}</a>{% if not loop.last %}, {% endif %}{% endfor %}</div><div class="wrap-price"><span class="price">{{ p.price_html|safe }}</span></div></div></div>
{%- endmacro -%}
