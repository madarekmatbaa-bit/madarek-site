{%- macro card(p, eager=False) -%}
<article class="m-card" data-id="{{ p.id }}"><a class="m-card-media" href="{{ p.path }}" tabindex="-1" aria-hidden="true"><img src="{{ p.thumb }}" width="430" height="430" alt="{{ p.alt }}"{% if not eager %} loading="lazy"{% endif %} decoding="async">{% if p.thumb2 %}<img class="m-card-alt" src="{{ p.thumb2 }}" width="430" height="430" alt="" loading="lazy" decoding="async">{% endif %}</a><div class="m-card-body"><p class="m-card-cat">{{ p.catname }}</p><h3 class="m-card-title"><a href="{{ p.path }}">{{ p.name }}</a></h3><p class="m-card-price">{{ p.price_short|safe }}{% if p.badge %}<span class="m-card-off">-{{ p.badge }}%</span>{% endif %}</p></div></article>
{%- endmacro -%}
